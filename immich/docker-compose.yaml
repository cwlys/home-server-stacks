services:

  #----- 01. immich server -----
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.0.1
    networks:
      npm_network:
        ipv4_address: 10.112.0.20
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - ${PHOTO_LOCATION_1}:/usr/src/app/photo
      - ${PHOTO_LOCATION_2}:/usr/src/app/eliza
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Taipei
      - IMMICH_PORT=2283
      - IMMICH_WORKER_PORT=3001
      - IMMICH_API_URL=http://immich_server:2283
      - IMMICH_SERVER_URL=http://immich_server:2283
      - DB_HOSTNAME=database
      - REDIS_HOSTNAME=redis
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
    devices:
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp=unconfined
    ports:
      - 2283:2283
      - 3001:3001
    depends_on:
      - redis
      - database
    restart: always

  #----- 02. immich machine learning -----
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.0.1
    networks:
      npm_network:
        ipv4_address: 10.112.0.21
    volumes:
      - /docker/immich/model-cache:/cache
    restart: always

  #----- 03. immich redis -----
  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    networks:
      npm_network:
        ipv4_address: 10.112.0.22
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  #----- 04. immich database -----
  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    networks:
      npm_network:
        ipv4_address: 10.112.0.23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

networks:
  npm_network:
    external: true
